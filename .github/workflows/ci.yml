name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run build

  katas:
    name: Kata solutions and starters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Every reference solution passes its tests
        working-directory: dotnet
        run: dotnet test --project Solutions/Solutions.csproj
      - name: Every starter compiles against its tests
        working-directory: dotnet
        run: dotnet build Starters/Starters.csproj
